<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DinoBlaze – Ateşten Kaç!</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#0a0a0f;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  min-height:100vh;
  font-family:'Press Start 2P',monospace;
  overflow:hidden;
  user-select:none;
}
#ui-header{
  display:flex;justify-content:space-between;align-items:center;
  width:500px;padding:8px 2px 6px;
}
#score-display{color:#f0c040;font-size:12px;text-shadow:0 0 8px #f0c04099;}
#hi-display{color:#ff6644;font-size:10px;}
#speed-display{color:#44ffaa;font-size:9px;}
#canvas-wrapper{
  position:relative;
  border:3px solid #2a2a3f;
  border-radius:6px;
  box-shadow:0 0 50px #ff440033, 0 0 100px #ff220011;
}
canvas{display:block;image-rendering:pixelated;}
#overlay{
  position:absolute;top:0;left:0;width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;

}
#overlay h1{font-size:17px;color:#f0c040;text-shadow:0 0 20px #f0c040,2px 2px 0 #a05000;margin-bottom:6px;letter-spacing:2px;text-align:center;}
.sub{font-size:7px;color:#888;margin-bottom:12px;letter-spacing:1px;text-align:center;}
.btn{font-family:'Press Start 2P',monospace;font-size:9px;padding:11px 24px;border:2px solid #f0c040;background:transparent;color:#f0c040;cursor:pointer;letter-spacing:1px;transition:all 0.1s;margin-top:6px;}
.btn:hover{background:#f0c04022;box-shadow:0 0 14px #f0c040;}
.btn:active{transform:scale(0.97);}
#final-score{font-size:12px;color:#ff8844;margin-bottom:6px;text-shadow:0 0 8px #ff8844;}
#leaderboard-section{margin-top:6px;width:310px;text-align:center;}
#leaderboard-section h3{font-size:7px;color:#44ffaa;margin-bottom:5px;}
.lb-row{display:flex;justify-content:space-between;font-size:6px;padding:3px 8px;color:#ccc;border-bottom:1px solid #1a1a2f;}
.lb-row.gold{color:#f0c040;}.lb-row.silver{color:#aab;}.lb-row.bronze{color:#c97;}
#name-input-area{display:none;flex-direction:column;align-items:center;gap:5px;margin-top:6px;}
#name-input-area input{font-family:'Press Start 2P',monospace;font-size:8px;padding:7px 10px;background:#0d0d1a;border:2px solid #f0c040;color:#f0c040;width:200px;outline:none;}
#name-input-area input::placeholder{color:#444;}
#firebase-status{font-size:6px;color:#555;margin-top:2px;}
#hint{position:absolute;bottom:7px;width:100%;text-align:center;font-size:6px;color:#2a2a4a;font-family:'Press Start 2P',monospace;}
</style>
</head>

<div id="ui-header">

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, push, query, orderByChild, limitToLast, get }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey:            "BURAYA_API_KEY_GIRIN",
    authDomain:        "PROJE_ID.firebaseapp.com",
    databaseURL:       "https://PROJE_ID-default-rtdb.firebaseio.com",
    projectId:         "PROJE_ID",
    storageBucket:     "PROJE_ID.appspot.com",
    messagingSenderId: "SENDER_ID",
    appId:             "APP_ID"
  };

  let db = null;
  try {
    if (!firebaseConfig.apiKey.includes('BURAYA')) {
      const app = initializeApp(firebaseConfig);
      db = getDatabase(app);
      document.getElementById('firebase-status').textContent = 'Firebase bagli';
      document.getElementById('firebase-status').style.color = '#44ffaa';
      loadLB();
    } else {
      document.getElementById('firebase-status').textContent = 'Firebase: config girilmedi (lokal mod)';
      renderLB([]);
    }
  } catch(e) { document.getElementById('firebase-status').textContent = 'Firebase hatasi'; }

  async function loadLB() {
    if (!db) return;
    try {
      const q = query(ref(db,'dinoblaze2_scores'), orderByChild('score'), limitToLast(10));
      const snap = await get(q);
      const rows = [];
      snap.forEach(c => rows.push(c.val()));
      rows.sort((a,b)=>b.score-a.score);
      renderLB(rows);
    } catch(e){}
  }

  function renderLB(rows) {
    const el = document.getElementById('lb-list');
    el.innerHTML='';
    if(!rows||!rows.length){el.innerHTML='<div class="lb-row" style="color:#444;justify-content:center;">Henuz kayit yok</div>';return;}
    const m=['gold','silver','bronze'];
    rows.slice(0,10).forEach((r,i)=>{
      const d=document.createElement('div');
      d.className='lb-row '+(m[i]||'');
      d.innerHTML=`<span>#${i+1} ${r.name||'???'}</span><span>${r.score} PTS</span>`;
      el.appendChild(d);
    });
  }

  window._fbSubmit = async (name, score) => {
    if(!db){alert('Firebase config eksik!');return;}
    await push(ref(db,'dinoblaze2_scores'),{name,score,ts:Date.now()});
    await loadLB();
  };
  window._fbReload = loadLB;
</script>

<!-- GAME ENGINE -->
<script>
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ────────────────────────────────────────────
// CONSTANTS
// ────────────────────────────────────────────
const GROUND_Y   = H - 50;   // hero floor
const DINO_Y     = 18;        // dino sits at top
const DINO_W     = 72;
const DINO_H     = 60;
const DINO_X     = W/2 - DINO_W/2;

const HERO_W     = 36;
const HERO_H     = 58;
const HERO_SPEED = 5;

// ────────────────────────────────────────────
// STATE
// ────────────────────────────────────────────
let state = 'menu';
let score = 0, hiScore = 0, frame = 0, speedMult = 1;
let nextSpeedUp = 30;

// Hero
const hero = {
  x: W/2 - HERO_W/2,
  y: GROUND_Y - HERO_H,
  w: HERO_W, h: HERO_H,
  vx: 0,
  walkFrame: 0,
  dir: 1,          // 1=right, -1=left
  invincible: 0,   // frames of invincibility after near-miss
  dodgeAnim: 0,    // lean animation
};

// Fireballs falling from dino
let balls  = [];
let nextBallIn = 60;

// Particles
let particles = [];

// Dino mouth anim
let dinoMouth = 0; // countdown

// Stars
const stars = Array.from({length:40},()=>({
  x:Math.random()*W, y:Math.random()*(GROUND_Y-80),
  r:Math.random()*1.2+0.3, b:Math.random()*Math.PI*2
}));

// ────────────────────────────────────────────
// CONTROLS
// ────────────────────────────────────────────
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if ((e.code==='Space') && (state==='menu'||state==='dead')) startGame();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// Mobile touch drag
let touchStartX = null;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  touchStartX = e.touches[0].clientX;
  if (state==='menu'||state==='dead') startGame();
}, {passive:false});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (state!=='playing') return;
  const dx = e.touches[0].clientX - touchStartX;
  hero.x = Math.max(0, Math.min(W-hero.w, hero.x + dx*1.5));
  touchStartX = e.touches[0].clientX;
  hero.dir = dx > 0 ? 1 : -1;
  hero.dodgeAnim = 8;
}, {passive:false});
canvas.addEventListener('touchend', ()=>{ touchStartX=null; }, {passive:false});

// ────────────────────────────────────────────
// SPAWN FIREBALL
// ────────────────────────────────────────────
function spawnBall() {
  // Aim roughly at hero with some randomness
  const targetX = hero.x + hero.w/2 + (Math.random()-0.5)*120;
  const x = Math.max(20, Math.min(W-20, targetX));

  const speed = (3.5 + Math.random()*2) * speedMult;
  balls.push({
    x, y: DINO_Y + DINO_H + 4,
    vx: (Math.random()-0.5)*1.5,
    vy: speed,
    r: 10 + Math.random()*5,
    phase: Math.random()*Math.PI*2,
    trail: [],
  });

  dinoMouth = 18;
  spawnBurstAt(DINO_X+DINO_W/2, DINO_Y+DINO_H, ['#ff4400','#ff8800','#ffcc00'], 6);

  nextBallIn = Math.floor((38 + Math.random()*50) / speedMult);
}

function spawnParticles(x,y,cols,n,vscale) {
  vscale = vscale||1;
  for(let i=0;i<n;i++) {
    particles.push({
      x, y,
      vx:(Math.random()-0.5)*5*vscale,
      vy:(Math.random()-1.6)*3*vscale,
      life:16+Math.random()*14,
      maxLife:30,
      color:cols[Math.floor(Math.random()*cols.length)],
      r:2+Math.random()*3,
    });
  }
}
function spawnBurstAt(x,y,cols,n){ spawnParticles(x,y,cols,n,1.2); }

// ────────────────────────────────────────────
// COLLISION
// ────────────────────────────────────────────
function circleRect(cx,cy,cr, rx,ry,rw,rh) {
  const nearX = Math.max(rx, Math.min(rx+rw, cx));
  const nearY = Math.max(ry, Math.min(ry+rh, cy));
  const dx = cx-nearX, dy = cy-nearY;
  return dx*dx + dy*dy < cr*cr;
}

// Near-miss: ball passed hero within margin but didn't hit
function isNearMiss(b) {
  return Math.abs(b.x - (hero.x+hero.w/2)) < b.r + 28;
}

// ────────────────────────────────────────────
// DRAW: DINO (top center, faces down, large)
// ────────────────────────────────────────────
function drawDino() {
  const x = DINO_X, y = DINO_Y;
  const w = DINO_W, h = DINO_H;
  const mouth = dinoMouth > 0;
  const b = Math.sin(frame*0.05)*1.5|0;

  // Glow under dino
  ctx.save();
  ctx.globalAlpha=0.18;
  ctx.fillStyle='#ff4400';
  ctx.beginPath(); ctx.ellipse(x+w/2, y+h+8, w*0.6, 12, 0,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // Body
  ctx.fillStyle='#1a7a25'; ctx.fillRect(x+8,  y+20+b, w-16, h-28);
  ctx.fillStyle='#2ecc40'; ctx.fillRect(x+6,  y+18+b, w-12, h-30);
  ctx.fillStyle='#aaffaa'; ctx.fillRect(x+16, y+28+b, 20, 18);

  // Tail (left side)
  ctx.fillStyle='#1a7a25';
  ctx.fillRect(x-6, y+30+b, 14, 8);
  ctx.fillRect(x-12,y+36+b, 10, 6);

  // Head (top, faces DOWN toward player)
  ctx.fillStyle='#2ecc40'; ctx.fillRect(x+10, y+b, w-20, 26);
  ctx.fillStyle='#1a7a25'; ctx.fillRect(x+14, y+2+b, w-28, 8);

  // Eyes (looking down)
  ctx.fillStyle='#fff';
  ctx.fillRect(x+14, y+10+b, 8, 8);
  ctx.fillRect(x+w-22, y+10+b, 8, 8);
  ctx.fillStyle='#111';
  ctx.fillRect(x+15, y+13+b, 5, 5); // looking down
  ctx.fillRect(x+w-21,y+13+b, 5, 5);
  ctx.fillStyle='#fff';
  ctx.fillRect(x+16, y+13+b, 2, 2);
  ctx.fillRect(x+w-20,y+13+b, 2, 2);

  // Mouth (bottom of head, fires down)
  if (mouth) {
    ctx.fillStyle='#cc2200'; ctx.fillRect(x+14, y+22+b, w-28, 10);
    for(let i=0;i<4;i++){
      ctx.fillStyle='#fff';
      ctx.fillRect(x+14+i*5, y+22+b, 4, 5);
      ctx.fillRect(x+16+i*5, y+27+b, 4, 5);
    }
    // Fire burst from mouth
    ctx.globalAlpha=0.7+0.3*Math.sin(frame*0.5);
    ctx.fillStyle='#ff6600';
    ctx.beginPath();
    ctx.arc(x+w/2, y+28+b, 10, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha=1;
  } else {
    ctx.fillStyle='#111'; ctx.fillRect(x+14, y+24+b, w-28, 4);
    for(let i=0;i<4;i++){ ctx.fillStyle='#fff'; ctx.fillRect(x+14+i*5, y+24+b, 4, 4); }
  }

  // Arms (tiny, down)
  ctx.fillStyle='#2ecc40';
  ctx.fillRect(x+4,  y+36+b, 8, 10);
  ctx.fillRect(x+w-12, y+36+b, 8, 10);

  // Legs (hanging down)
  ctx.fillStyle='#1a7a25';
  ctx.fillRect(x+16, y+h-10+b, 12, 12);
  ctx.fillRect(x+w-28, y+h-10+b, 12, 12);

  dinoMouth = Math.max(0, dinoMouth-1);
}

// ────────────────────────────────────────────
// DRAW: HERO (pixel warrior, runs left/right)
// ────────────────────────────────────────────
function drawHero() {
  const {x, y, w, h, dir, walkFrame, dodgeAnim, invincible} = hero;

  if (invincible > 0 && frame%4 < 2) { ctx.globalAlpha=0.4; }

  // Lean based on dodge
  const lean = dir * Math.min(dodgeAnim, 8) * 0.04;
  ctx.save();
  ctx.translate(x + w/2, y + h);
  ctx.rotate(lean);
  ctx.translate(-(x + w/2), -(y + h));

  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(x+w/2, GROUND_Y+3, w*0.45, 5, 0,0,Math.PI*2); ctx.fill();

  const la = Math.sin(walkFrame*0.28)*6|0;
  const isMoving = hero.vx !== 0;

  // Boots
  ctx.fillStyle='#5a3010';
  if (isMoving) {
    ctx.fillRect(x+3,  y+h-16+la, 13, 16);
    ctx.fillRect(x+w-16, y+h-16-la, 13, 16);
  } else {
    ctx.fillRect(x+3,  y+h-16, 13, 16);
    ctx.fillRect(x+w-16, y+h-16, 13, 16);
  }

  // Legs
  ctx.fillStyle='#6b4020';
  if (isMoving) {
    ctx.fillRect(x+5,  y+h-32+la, 12, 18);
    ctx.fillRect(x+w-17, y+h-32-la, 12, 18);
  } else {
    ctx.fillRect(x+5,  y+h-32, 12, 18);
    ctx.fillRect(x+w-17, y+h-32, 12, 18);
  }

  // Cape (red, flows behind)
  ctx.fillStyle='#cc2222';
  ctx.fillRect(x+2, y+14, w-4, h-30);
  // Body
  ctx.fillStyle='#2255cc'; ctx.fillRect(x+5, y+14, w-10, h-34);
  // Belt
  ctx.fillStyle='#8b5a20'; ctx.fillRect(x+4, y+32, w-8, 5);
  ctx.fillStyle='#f0c040'; ctx.fillRect(x+w/2-4|0, y+32, 8, 5);
  // Arms
  ctx.fillStyle='#2255cc';
  ctx.fillRect(x-1, y+16, 7, 20);
  ctx.fillRect(x+w-6, y+16, 7, 20);

  // Shield (raised above head when dodging)
  const shieldY = dodgeAnim > 2 ? y - 4 : y + 2;
  ctx.fillStyle='#8b5a20'; ctx.beginPath(); ctx.arc(x+w-4, shieldY+10, 14, 0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#c0c0c0'; ctx.beginPath(); ctx.arc(x+w-4, shieldY+10, 11, 0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#aaaacc';
  ctx.fillRect(x+w-8, shieldY+3, 4, 14);
  ctx.fillRect(x+w-12, shieldY+8, 12, 4);

  // Sword (pointing up)
  ctx.fillStyle='#c0c0c0'; ctx.fillRect(x-8, y+20, 4, 18);
  ctx.fillStyle='#f0c040'; ctx.fillRect(x-10, y+26, 8, 5);

  // Head
  ctx.fillStyle='#f0c080'; ctx.fillRect(x+7, y+2, w-14, 18);
  // Hair
  ctx.fillStyle='#1a1a33'; ctx.fillRect(x+6, y, w-12, 8); ctx.fillRect(x+5, y+2, 4, 6);
  // Eyes (look in direction of movement)
  const eyeOff = dir > 0 ? 2 : -2;
  ctx.fillStyle='#111';
  ctx.fillRect(x+9+eyeOff, y+8, 4, 4);
  ctx.fillRect(x+w-13+eyeOff, y+8, 4, 4);
  ctx.fillStyle='#fff';
  ctx.fillRect(x+10+eyeOff, y+8, 2, 2);
  ctx.fillRect(x+w-12+eyeOff, y+8, 2, 2);
  // Mouth (grimace when dodging, smile otherwise)
  ctx.fillStyle='#5a2010';
  if (dodgeAnim > 3) {
    ctx.fillRect(x+10, y+14, w-20, 2);
  } else {
    ctx.fillRect(x+10, y+15, 4, 2);
    ctx.fillRect(x+w-14, y+15, 4, 2);
    ctx.fillRect(x+14, y+16, w-28, 2);
  }

  ctx.restore();
  ctx.globalAlpha=1;
}

// ────────────────────────────────────────────
// DRAW: FIREBALL
// ────────────────────────────────────────────
function drawBall(b) {
  const t = frame * 0.15 + b.phase;

  // Trail
  b.trail.forEach((pt, i) => {
    const a = (i / b.trail.length) * 0.5;
    ctx.globalAlpha = a;
    const tr = b.r * (i / b.trail.length) * 0.9;
    ctx.fillStyle = i % 2 === 0 ? '#ff4400' : '#ff8800';
    ctx.beginPath(); ctx.arc(pt.x, pt.y, tr, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha=1;

  // Core: animated flame ball
  const layers = [
    {r:b.r,      c:'#ff2200'},
    {r:b.r*0.75, c:'#ff6600'},
    {r:b.r*0.5,  c:'#ffaa00'},
    {r:b.r*0.28, c:'#ffee88'},
  ];
  layers.forEach(({r,c},i) => {
    const wobble = Math.sin(t + i*1.3)*2;
    ctx.fillStyle=c;
    ctx.beginPath();
    ctx.arc(b.x + wobble, b.y, r, 0, Math.PI*2);
    ctx.fill();
  });

  // Glow
  ctx.save();
  ctx.globalAlpha=0.15;
  ctx.fillStyle='#ff4400';
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r*2.2, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

// ────────────────────────────────────────────
// DRAW: GROUND & BG
// ────────────────────────────────────────────
function drawGround() {
  // Ground block
  ctx.fillStyle='#1a1a2e'; ctx.fillRect(0, GROUND_Y, W, H-GROUND_Y);
  ctx.strokeStyle='#3a3a5a'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,GROUND_Y); ctx.lineTo(W,GROUND_Y); ctx.stroke();
  // Pixel dots
  for(let i=0;i<W;i+=20) {
    ctx.fillStyle='#2a2a4a';
    ctx.fillRect(i+4, GROUND_Y+6, 3, 3);
    ctx.fillRect(i+14, GROUND_Y+14, 2, 2);
  }
  // Wall danger lines (edges)
  ctx.globalAlpha=0.3;
  ctx.fillStyle='#ff2200';
  ctx.fillRect(0, GROUND_Y-3, 4, 3);
  ctx.fillRect(W-4, GROUND_Y-3, 4, 3);
  ctx.globalAlpha=1;
}

function drawStars() {
  stars.forEach(s=>{
    ctx.globalAlpha=0.3+0.35*Math.sin(s.b+frame*0.018);
    ctx.fillStyle='#fff';
    ctx.fillRect(s.x,s.y,s.r,s.r);
  });
  ctx.globalAlpha=1;
}

function drawParticles() {
  particles.forEach(p=>{
    ctx.globalAlpha=p.life/p.maxLife;
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x-p.r,p.y-p.r,p.r*2,p.r*2);
  });
  ctx.globalAlpha=1;
}

// Score pop text
let popTexts = [];
function addPop(x,y,text,color) {
  popTexts.push({x,y,text,color,life:40,maxLife:40,vy:-1.2});
}

function drawPops() {
  popTexts.forEach(p=>{
    ctx.globalAlpha=p.life/p.maxLife;
    ctx.fillStyle=p.color||'#f0c040';
    ctx.font='bold 9px "Press Start 2P", monospace';
    ctx.textAlign='center';
    ctx.fillText(p.text, p.x, p.y);
  });
  ctx.globalAlpha=1;
  ctx.textAlign='left';
}

// Danger warning: red flash when ball near hero
let dangerFlash = 0;

function drawDanger() {
  if (dangerFlash > 0) {
    ctx.globalAlpha = dangerFlash/20 * 0.18;
    ctx.fillStyle='#ff0000';
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;
    dangerFlash--;
  }
}

// ────────────────────────────────────────────
// HUD
// ────────────────────────────────────────────
function updateHUD() {
  document.getElementById('score-display').textContent='SKOR: '+score;
  document.getElementById('hi-display').textContent='EN IYI: '+hiScore;
  document.getElementById('speed-display').textContent='HIZ: '+speedMult.toFixed(1)+'x';
}

// ────────────────────────────────────────────
// GAME LOOP
// ────────────────────────────────────────────
function loop() {
  if (state!=='playing') return;
  frame++;

  // Score: +1 per 4 frames survived
  if (frame%4===0) {
    score++;
    if (score >= nextSpeedUp) {
      speedMult = Math.round((speedMult+0.1)*10)/10;
      nextSpeedUp += 30;
      addPop(W/2, H/2-40, 'HIZ ARTTI!', '#f0c040');
      spawnParticles(W/2, 80, ['#f0c040','#ff8800','#fff'], 14);
    }
  }

  // Hero movement
  hero.vx = 0;
  if (keys['ArrowLeft']||keys['KeyA']) { hero.vx = -HERO_SPEED; hero.dir=-1; hero.dodgeAnim=8; }
  if (keys['ArrowRight']||keys['KeyD']) { hero.vx = HERO_SPEED;  hero.dir= 1; hero.dodgeAnim=8; }

  hero.x = Math.max(0, Math.min(W-hero.w, hero.x + hero.vx));
  if (hero.vx!==0) hero.walkFrame++;
  hero.dodgeAnim = Math.max(0, hero.dodgeAnim-1);
  hero.invincible = Math.max(0, hero.invincible-1);

  // Spawn fireballs
  nextBallIn--;
  if (nextBallIn<=0) spawnBall();

  // Move fireballs
  balls.forEach(b => {
    b.trail.push({x:b.x, y:b.y});
    if (b.trail.length>8) b.trail.shift();
    b.x += b.vx;
    b.y += b.vy;

    // Danger flash when ball close vertically
    if (b.y > H*0.55 && b.y < GROUND_Y - 20) {
      const dist = Math.abs(b.x - (hero.x+hero.w/2));
      if (dist < 60) dangerFlash = Math.max(dangerFlash, 12);
    }
  });

  // Ball hits ground → splat particles, check near-miss
  const survived = [];
  balls.forEach(b => {
    if (b.y + b.r >= GROUND_Y) {
      // Near miss = dodged!
      if (isNearMiss(b) && hero.invincible===0) {
        const pts = 5 * Math.round(speedMult);
        score += pts;
        addPop(b.x, GROUND_Y-30, '+'+pts+'!', '#44ffaa');
        hero.invincible = 20;
      }
      spawnParticles(b.x, GROUND_Y, ['#ff4400','#ff8800','#ffcc00','#333'], 12, 0.8);
      return; // remove
    }
    if (b.y < -20) return; // off top (shouldn't happen)

    // Hit hero
    if (hero.invincible===0 && circleRect(b.x, b.y, b.r, hero.x, hero.y, hero.w, hero.h)) {
      spawnParticles(b.x, b.y, ['#ff2200','#ff8800','#ffcc00'], 20, 1.5);
      die();
      return;
    }
    survived.push(b);
  });
  balls = survived;

  // Particles
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life--;});
  particles=particles.filter(p=>p.life>0);
  popTexts.forEach(p=>{p.y+=p.vy;p.life--;});
  popTexts=popTexts.filter(p=>p.life>0);

  // ── DRAW ──
  ctx.fillStyle='#0d0d1a'; ctx.fillRect(0,0,W,H);
  drawStars();
  drawDino();
  balls.forEach(drawBall);
  drawGround();
  drawParticles();
  drawHero();
  drawPops();
  drawDanger();
  updateHUD();

  requestAnimationFrame(loop);
}

// ────────────────────────────────────────────
function die() {
  if (state==='dead') return;
  state='dead';
  if (score>hiScore) hiScore=score;

  const ov=document.getElementById('overlay');
  ov.style.display='flex';
  ov.querySelector('h1').textContent='YANDIK!';
  document.querySelector('.sub').textContent='Dino kazandi bu sefer...';
  document.getElementById('final-score').style.display='block';
  document.getElementById('final-score').textContent='PUANIN: '+score;
  document.getElementById('name-input-area').style.display='flex';
  document.getElementById('startBtn').textContent='TEKRAR OYNA';
  updateHUD();
  if(window._fbReload) window._fbReload();
}

function startGame() {
  score=0; frame=0; speedMult=1; nextSpeedUp=30;
  balls=[]; particles=[]; popTexts=[]; dangerFlash=0;
  hero.x=W/2-hero.w/2; hero.vx=0; hero.walkFrame=0;
  hero.dir=1; hero.invincible=0; hero.dodgeAnim=0;
  nextBallIn=80; dinoMouth=0;
  state='playing';
  document.getElementById('overlay').style.display='none';
  requestAnimationFrame(loop);
}

window.submitScore = async function() {
  const name=document.getElementById('playerName').value.trim()||'ANONIM';
  if(window._fbSubmit) await window._fbSubmit(name, score);
  document.getElementById('name-input-area').style.display='none';
  document.getElementById('playerName').value='';
};

// Init frame
(function(){
  ctx.fillStyle='#0d0d1a'; ctx.fillRect(0,0,W,H);
  drawStars(); drawGround(); drawDino();
  // draw hero in center
  hero.x=W/2-hero.w/2; hero.y=GROUND_Y-hero.h;
  drawHero();
})();
</script>
</body>
